<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriber</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 44rem;
    margin: 3rem auto;
    padding: 0 1rem;
    line-height: 1.5;
    color: #1d1d1f;
    background: #fff;
  }
  h1 { margin-bottom: 0.25rem; }
  .hint { color: #555; margin-top: 0; }
  form { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin: 1.5rem 0 1rem; }
  button {
    font: inherit;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: 1px solid #0066cc;
    background: #0066cc;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { min-height: 1.5rem; }
  #status.error { color: #b00020; font-weight: 600; }
  textarea {
    width: 100%;
    min-height: 16rem;
    box-sizing: border-box;
    font: inherit;
    padding: 0.75rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Transcriber</h1>
  <p class="hint">Upload a recording and get the text back. Everything stays on this computer.</p>

  <form id="form">
    <input id="file" type="file" accept=".mp3,.m4a,.wav,.webm" aria-label="Audio file">
    <button id="go" type="submit" disabled>Transcribe</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <textarea id="text" readonly aria-label="Transcript"></textarea>
    <p><button id="download" type="button">Download .txt</button></p>
  </section>

<script>
  const form = document.getElementById("form");
  const fileInput = document.getElementById("file");
  const goButton = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");
  const textArea = document.getElementById("text");
  const downloadButton = document.getElementById("download");
  let downloadName = "transcript.txt";

  function showStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? "error" : "";
  }

  function clearResult() {
    result.hidden = true;
    textArea.value = "";
  }

  fileInput.addEventListener("change", () => {
    clearResult();
    showStatus("", false);
    goButton.disabled = !fileInput.files.length;
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!fileInput.files.length) return;

    clearResult();
    goButton.disabled = true;
    fileInput.disabled = true;
    showStatus("Working… this can take up to a minute.", false);

    const body = new FormData();
    body.append("file", fileInput.files[0]);

    try {
      const response = await fetch("/transcribe", { method: "POST", body });
      let data = {};
      try { data = await response.json(); } catch (_) {}

      if (response.ok && data.text) {
        textArea.value = data.text;
        downloadName = data.filename || "transcript.txt";
        result.hidden = false;
        showStatus("Done.", false);
      } else {
        showStatus(data.error || "Something went wrong while transcribing. Please try again.", true);
      }
    } catch (_) {
      showStatus("Could not reach the transcriber. Is it still running?", true);
    } finally {
      goButton.disabled = !fileInput.files.length;
      fileInput.disabled = false;
    }
  });

  downloadButton.addEventListener("click", () => {
    const blob = new Blob([textArea.value], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = downloadName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  });
</script>
</body>
</html>
